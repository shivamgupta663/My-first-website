<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Practice Arena - Master Sets</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-glow: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-btn:hover { color: var(--accent-blue); }

        h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-sub);
            margin-bottom: 30px;
            font-size: 0.95rem;
            text-align: center;
        }

        /* Trendy Mode Switcher Tabs */
        .tabs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.03);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        /* Active Tab Status Tints */
        .tab-btn.active[data-mode="normal"] { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); }
        .tab-btn.active[data-mode="high"] { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .tab-btn.active[data-mode="reasoning"] { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

        /* Quiz Cards */
        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: #131c2e;
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--accent-blue);
            background-color: #1b2640;
        }

        .option-btn.correct {
            background-color: rgba(74, 222, 128, 0.15) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green);
        }

        .option-btn.wrong {
            background-color: rgba(248, 113, 113, 0.15) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="class10.html" class="back-btn">← Back to Arena</a>
        <h1>📐 GST Practice Portal</h1>
        <p class="subtitle">Switch difficulty instantly without changing tabs</p>

        <div class="tabs-container">
            <button class="tab-btn active" data-mode="normal" onclick="switchMode('normal')">Normal Level</button>
            <button class="tab-btn" data-mode="high" onclick="switchMode('high')">High Level</button>
            <button class="tab-btn" data-mode="reasoning" onclick="switchMode('reasoning')">Assertion & Reason</button>
        </div>

        <div id="quiz-arena"></div>
    </div>

    <script>
        // Master Question Repository
        const masterQuestions = {
            normal: [
                { q: "An article is sold for ₹5,000 within the same state. If the GST rate is 12%, find the CGST amount.", ops: ["₹600", "₹300", "₹150", "₹1,200"], ai: 1 },
                { q: "A service cost is ₹2,500. Under intra-state transaction, the SGST charged is ₹225. Find the total rate of GST.", ops: ["9%", "12%", "18%", "5%"], ai: 2 },
                { q: "The marked price of an item is ₹45,000. A shopkeeper allows a flat 10% discount. If the rate of GST is 28%, find the total amount the consumer has to pay.", ops: ["₹51,840", "₹57,600", "₹40,500", "₹11,340"], ai: 0 },
                { q: "An item listed at ₹8,000 is available at a 20% discount. If a customer pays a total of ₹7,552 including GST, what is the rate of GST?", ops: ["5%", "12%", "18%", "28%"], ai: 2 },
                { q: "A trader bought goods for ₹6,000 and paid a total GST of ₹300. What was the rate of GST?", ops: ["5%", "12%", "6%", "2.5%"], ai: 0 }
            ],
            high: [
                { q: "A shopkeeper buys an article from a wholesaler for ₹12,000 and sells it to a consumer at a profit of 25%. If the rate of GST is 18%, and the transaction is intra-state, calculate the CGST paid by the shopkeeper to the government.", ops: ["₹270", "₹540", "₹1,080", "₹1,350"], ai: 0 },
                { q: "A continuous multi-stage transaction happens within Punjab: Manufacturer → Dealer → Consumer. The manufacturer sells goods to the dealer for ₹10,000. The dealer raises the price and sells to the consumer. If the consumer pays a total SGST of ₹900 at a GST rate of 18%, what was the dealer's profit?", ops: ["₹0", "₹2,000", "₹5,000", "₹1,000"], ai: 0 },
                { q: "A service provider in Rajasthan provides services worth ₹8,000 to a client in Gujarat. The client then provides a modified service to an end-user in Gujarat for ₹12,000. If the GST rate is 18%, find the net IGST paid by the intermediate client to the government.", ops: ["₹0", "₹720", "₹1,440", "₹2,160"], ai: 0 },
                { q: "An article is available at a marked price of ₹40,000. A retailer allows two successive discounts of 10% each, and then charges GST at 5%. Calculate the total amount a customer needs to pay.", ops: ["₹34,020", "₹33,600", "₹35,700", "₹32,400"], ai: 0 },
                { q: "An article marked at ₹5,000 is sold at a discount of 20%. If the consumer pays a total amount of ₹4,480 including GST, find the rate of GST applied.", ops: ["12%", "5%", "18%", "28%"], ai: 0 }
            ],
            reasoning: [
                { q: "Assertion (A): For an intra-state transaction, the central government and state government collect equal shares of tax.\nReason (R): In an intra-state supply of goods, CGST rate is always equal to SGST rate, and each is exactly half of total GST.", ops: ["Both A and R are true and R is correct explanation", "Both A and R are true but R is not correct explanation", "A is true but R is false", "A is false but R is true"], ai: 0 },
                { q: "Assertion (A): No IGST is levied on services provided from Delhi to Noida (UP).\nReason (R): Noida and Delhi are part of the National Capital Region (NCR) but belong to two different states.", ops: ["A is false but R is true", "Both A and R are true and R is correct explanation", "Both A and R are true but R is not correct explanation", "A is true but R is false"], ai: 0 },
                { q: "Assertion (A): The Input Tax Credit (ITC) can be used to reduce the tax liability on outward supplies.\nReason (R): GST is a single-stage tax levied only at the final point of consumption without credit mechanisms.", ops: ["A is true but R is false", "Both A and R are true and R is correct explanation", "Both A and R are true but R is not correct explanation", "A is false but R is true"], ai: 0 }
            ]
        };

        function renderQuestions(mode) {
            const arena = document.getElementById('quiz-arena');
            arena.innerHTML = ''; // Clear previous questions
            
            const list = masterQuestions[mode];
            list.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';

                const qText = document.createElement('div');
                qText.className = 'q-text';
                qText.innerText = `Q${idx + 1}. ${item.q}`;
                card.appendChild(qText);

                const grid = document.createElement('div');
                grid.className = 'options-grid';

                item.ops.forEach((opt, oIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    
                    btn.onclick = () => {
                        const buttons = grid.querySelectorAll('.option-btn');
                        buttons.forEach(b => b.disabled = true);
                        
                        if(oIdx === item.ai) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('wrong');
                            buttons[item.ai].classList.add('correct');
                        }
                    };
                    grid.appendChild(btn);
                });

                card.appendChild(grid);
                arena.appendChild(card);
            });
        }

        function switchMode(mode) {
            // Update active button layout styling
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-mode="${mode}"]`).classList.add('active');
            
            // Render target question bank
            renderQuestions(mode);
        }

        // Default initial load
        renderQuestions('normal');
    </script>
</body>
</html>
