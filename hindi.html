    <script>
        // SUBJECTIVE HINDI LONG ANSWERS DATABASE
        const hindiDatabase = {
            baat_athanni_ki: {
                title: "1. बात अठन्नी की (सुदर्शन)",
                type: "gadhya",
                sub: "चरित्र चित्रण, रिश्वतखोरी एवं न्याय व्यवस्था पर आधारित दीर्घ उत्तरीय प्रश्न",
                questions: [
                    { q: "प्रश्न 1: रसीला कौन था और उसकी पारिवारिक स्थिति का वर्णन कीजिए? वह अपने वेतन से असंतुष्ट क्यों था?", ans: "उत्तर: रसीला बाबू जगतसिंह के यहाँ दस रुपये मासिक वेतन पर रसोइया था। उसके परिवार में बूढ़े पिता, एक पत्नी, एक लड़की और दो लड़के थे, जो गाँव में रहते थे। उसका पूरा वेतन परिवार के भरण-पोषण के लिए कम पड़ता था। वह अपने वेतन से इसलिए असंतुष्ट था क्योंकि उसके मालिक (इंजीनियर बाबू) उसकी वर्षों की सेवा के बावजूद उसका वेतन बढ़ाने को तैयार नहीं थे, जबकि रसीला को अपने बीमार बच्चों के इलाज के लिए अधिक पैसों की आवश्यकता थी।" },
                    { q: "प्रश्न 2: रमजान ने रसीला की उदासी का कारण जानकर उसकी मदद किस प्रकार की? इससे रमजान के चरित्र की किस विशेषता का पता चलता है?", ans: "उत्तर: रमजान ने जब देखा कि रसीला अपने बच्चों की बीमारी और पैसों की तंगी के कारण बहुत उदास है, तो उसने बिना किसी संकोच के अपनी कोठरी से लाकर साढ़े चार रुपये रसीला के हाथ पर रख दिए। इससे रमजान के चरित्र की निस्वार्थता, सच्ची मित्रता और संवेदनशीलता का पता चलता है। वह स्वयं एक मामूली चौकीदार था, फिर भी उसने धर्म या जाति की परवाह किए बिना संकट के समय अपने मित्र की आर्थिक सहायता की।" },
                    { q: "प्रश्न 3: 'बात अठन्नी की' कहानी के आधार पर बाबू जगतसिंह और शेख सलीमुद्दीन के माध्यम से समाज के किस कड़वे सच को उजागर किया गया है?", ans: "उत्तर: कहानी में बाबू जगतसिंह (इंजीनियर) और शेख सलीमुद्दीन (जिला मजिस्ट्रेट) समाज के उच्च, प्रतिष्ठित लेकिन अत्यंत भ्रष्ट और सफेदपोश वर्ग का प्रतिनिधित्व करते हैं। लेखक ने दिखाया है कि ये लोग पर्दे के पीछे क्रमशः ₹500 और ₹1000 जैसी बड़ी-बड़ी रिश्वतें लेते हैं, लेकिन समाज में न्यायप्रिय होने का ढोंग करते हैं। यह कहानी समाज के इस दोहरे चरित्र और भ्रष्टाचार को उजागर करती है।" },
                    { q: "प्रश्न 4: रसीला द्वारा की गई अठन्नी की चोरी का पूरा घटनाक्रम क्या था? वह चोरी करने पर मजबूर क्यों हुआ?", ans: "उत्तर: रसीला ने रमजान का लगभग पूरा कर्ज चुका दिया था, केवल आठ आने (अठन्नी) बाकी थे। एक दिन बाबू जगतसिंह ने रसीला को पांच रुपये देकर मिठाई लाने भेजा। रसीला ने रमजान का कर्ज उतारने की जल्दी में साढ़े चार रुपये की मिठाई ली और बचे हुए आठ आने रमजान को दे दिए। रसीला कोई पेशेवर चोर नहीं था, बल्कि वह कर्ज के बोझ और अपने ईमान को साफ करने की व्याकुलता के कारण इस छोटी सी हेराफेरी को कर बैठा।" },
                    { q: "प्रश्न 5: बाबू जगतसिंह ने रसीला का अपराध जानने पर उसके साथ कैसा व्यवहार किया? क्या उनका यह व्यवहार न्यायसंगत था?", ans: "उत्तर: हलवाई से सच जानने के बाद बाबू जगतसिंह ने रसीला को निर्दयता से पीटा, उसे घसीटते हुए पुलिस थाने ले गए और सिपाही को पाँच रुपये की रिश्वत देकर रसीला से जुर्म कबूलवाने को कहा। उनका यह व्यवहार बिल्कुल भी न्यायसंगत नहीं था, क्योंकि एक वफादार नौकर जिसने सालों सेवा की, उसकी मजबूरी समझे बिना एक अठन्नी के लिए उसे जानवरों की तरह पीटना उनकी क्रूरता और संवेदनहीनता को दर्शाता है।" },
                    { q: "प्रश्न 6: अदालत में रसीला ने अपना जुर्म क्यों कबूल कर लिया? उसके इस कदम से उसके स्वभाव के बारे में क्या पता चलता है?", ans: "उत्तर: अदालत में रसीला चाहता तो मजिस्ट्रेट के सामने झूठ बोल सकता था, लेकिन उसने अपना अपराध स्वीकार कर लिया और कहा कि 'माई बाप, गलती हो गई, पहली बार हुई है, माफ़ कर दें।' इससे पता चलता है कि रसीला के भीतर अभी भी सच्चाई, ईमानदारी और पश्चाताप की भावना जीवित थी। वह चालाक अपराधियों की तरह झूठ बोलना नहीं जानता था।" },
                    { q: "प्रश्न 7: जिला मजिस्ट्रेट शेख सलीमुद्दीन द्वारा रसीला को दी गई सज़ा पर रमजान की क्या प्रतिक्रिया थी? 'आँखों में खून उतर आना' मुहावरे का महत्व स्पष्ट करें।", ans: "उत्तर: शेख सलीमुद्दीन ने रसीला को छह महीने की कठोर कैद की सजा सुनाई। यह सुनकर रमजान की आँखों में खून उतर आया, जिसका अर्थ है अत्यधिक क्रोध आना। रमजान को इस बात पर गहरा गुस्सा आया कि जो जज स्वयं हजारों की रिश्वत लेते हैं, वे एक गरीब को सिर्फ आठ आने की चोरी पर छह महीने के लिए जेल भेज रहे हैं। उसे यह न्याय नहीं, बल्कि अंधेर नगरी लगा।" },
                    { q: "प्रश्न 8: 'यह दुनिया इंसानों की नहीं, पशुओं की है। यहाँ केवल क्रूर और स्वार्थी लोग ही सुखी रह सकते हैं।' इस कथन के संदर्भ में कहानी का उद्देश्य स्पष्ट कीजिए।", ans: "उत्तर: इस कथन के माध्यम से लेखक ने समाज की संवेदनहीन न्याय व्यवस्था पर करारा व्यंग्य किया है। कहानी का उद्देश्य यह दिखाना है कि कानून और अदालतें केवल गरीबों को सजा देने के लिए हैं, जबकि समाज के बड़े-बड़े सफेदपोश अपराधी जो देश को लूट रहे हैं, वे ऊंचे पदों पर बैठकर मजे करते हैं। यहाँ गरीबों की लाचारी और ईमानदारी का कोई मूल्य नहीं है।" },
                    { q: "प्रश्न 9: 'बात अठन्नी की' शीर्षक की सार्थकता पर विचार कीजिए। क्या यह शीर्षक उचित है?", ans: "उत्तर: इस कहानी का शीर्षक 'बात अठन्नी की' पूर्णतः सार्थक और अत्यंत उपयुक्त है। पूरी कहानी इसी अठन्नी (आठ आने) के इर्द-गिर्द घूमती है। यही अठन्नी रसीला की ईमानदारी पर दाग लगाती है, इसी के कारण उसे छह महीने की जेल होती है और इसी अठन्नी के बहाने समाज के बड़े चोरों का असली चेहरा सामने आता है। यह छोटी सी रकम समाज के बड़े अन्याय को दर्शाने का माध्यम बनती है।" },
                    { q: "प्रश्न 10: कहानी के अंत में रमजान ने बड़ी कोठियों की ओर देखकर क्या टिप्पणी की और उसका क्या गूढ़ अर्थ था?", ans: "उत्तर: कहानी के अंत में रमजान कहता है- 'अरे, असली चोर तो बड़ी-बड़ी कोठियों में बैठकर मजे कर रहे हैं।' इसका गूढ़ अर्थ यह है कि समाज में न्याय का मापदंड अमीर और गरीब के लिए अलग है। महलों में रहने वाले लोग बड़े-बड़े घोटाले और रिश्वतखोरी करके भी समाज में इज्जत पाते हैं, जबकि भूखा-प्यासा गरीब यदि एक अठन्नी की भूल कर दे, तो उसे अपराधी घोषित कर दिया जाता है।" }
                ]
            },
            sakhi: {
                title: "11. साखी (कबीरदास)",
                type: "padhya",
                sub: "दोहे, गुरु महिमा, ईश्वर भक्ति और व्यावहारिक ज्ञान पर आधारित दीर्घ उत्तरीय प्रश्न",
                questions: [
                    { q: "प्रश्न 1: कबीरदास जी ने अपने दोहों में गुरु को गोविंद (ईश्वर) से भी श्रेष्ठ क्यों माना है? इसके पीछे क्या तर्क है?", ans: "उत्तर: कबीरदास जी के अनुसार, यदि गुरु और ईश्वर दोनों एक साथ सामने खड़े हों, तो सबसे पहले गुरु के चरण छूने चाहिए। इसके पीछे तर्क यह है कि गुरु ही वह माध्यम है जिन्होंने हमें ज्ञान की आंखें दीं और ईश्वर को पहचानने और उन तक पहुँचने का मार्ग दिखाया। गुरु के बिना मनुष्य अज्ञान के अंधकार में भटका रहता है, इसलिए गुरु का स्थान ईश्वर से भी ऊपर है।" },
                    { q: "प्रश्न 2: 'जब मैं था तब हरि नहीं, अब हरि हैं मैं नाहिं'—इस पंक्ति का आध्यात्मिक अर्थ स्पष्ट कीजिए। यहाँ 'मैं' से क्या तात्पर्य है?", ans: "उत्तर: यहाँ 'मैं' का अर्थ 'अहंकार' (Ego) से है। कबीरदास जी कहते हैं कि जब तक मनुष्य के हृदय में अहंकार रहता है, तब तक वहाँ ईश्वर (हरि) का वास नहीं हो सकता। जब ज्ञान के प्रकाश से अहंकार पूरी तरह नष्ट हो जाता है, तब हृदय में ईश्वर का साक्षात्कार होता है। अहंकार और परमात्मा दोनों एक स्थान पर एक साथ कभी नहीं रह सकते।" },
                    { q: "प्रश्न 3: कबीर के अनुसार संसार के लोग अज्ञानता वश ईश्वर को कहाँ-कहाँ ढूंढते हैं, जबकि ईश्वर वास्तव में कहाँ निवास करते हैं?", ans: "उत्तर: अज्ञानता के कारण लोग ईश्वर को मंदिरों, मस्जिदों, तीर्थ स्थानों, जंगलों में या कठिन क्रियाओं में ढूंढते फिरते हैं। लेकिन कबीर कहते हैं कि 'कस्तूरी कुंडल बसै, मृग ढूंढे बन माहि'—जिस प्रकार हिरण अपनी ही नाभि में छिपी कस्तूरी की खुशबू के लिए पूरे जंगल में भटकता है, उसी प्रकार ईश्वर हर मनुष्य के हृदय के भीतर (घट-घट में) निवास करते हैं, उन्हें बाहर खोजना व्यर्थ है।" },
                    { q: "प्रश्न 4: 'पोथी पढ़ि पढ़ि जग मुआ, पंडित भया न कोइ'—इस साखी के माध्यम से कबीर किस प्रकार के ज्ञान को महत्व देते हैं?", ans: "उत्तर: इस साखी के माध्यम से कबीर किताबी या शास्त्रीय ज्ञान का खंडन करते हैं। वे कहते हैं कि बड़ी-बड़ी पुस्तकें या वेद पढ़ लेने से कोई विद्वान या सच्चा मनुष्य नहीं बन जाता। वास्तविक ज्ञानी या पंडित वह है जो 'ढाई आखर प्रेम का' पढ़ ले, अर्थात जो मानवता, प्रेम, करुणा और सहानुभूति के व्यावहारिक ज्ञान को अपने जीवन में उतार ले।" },
                    { q: "प्रश्न 5: कबीरदास जी ने 'निंदक' (आलोचना करने वाले) को अपने पास रखने की सलाह क्यों दी है? उसे कहाँ स्थान देना चाहिए?", ans: "उत्तर: कबीर का मानना है कि निंदक (आलोचक) को हमेशा अपने पास, यहाँ तक कि अपने आंगन में कुटिया बनवाकर रखना चाहिए। इसका कारण यह है कि निंदक बिना साबुन और पानी के हमारी कमियों को बताकर हमारे स्वभाव को साफ और निर्मल बना देता है। उसकी आलोचनाओं को सुनकर हम अपनी गलतियों को सुधार सकते हैं, जिससे हमारा आत्म-विकास होता है।" },
                    { q: "प्रश्न 6: 'सुखिया सब संसार है, खावै औरु सोवै'—इस पंक्ति में कबीरदास जी के रोने और जागने का क्या कारण है? आम लोग उनसे अलग कैसे हैं?", ans: "उत्तर: आम संसारी लोग केवल खाने, पीने और सोने को ही जीवन का परम सुख मानकर अज्ञान की नींद में सो रहे हैं और खुश हैं। लेकिन कबीर दास जी संसार की इस नश्वरता और मनुष्यों के भटकाव को देखकर जाग रहे हैं और रो रहे हैं। वे जानते हैं कि मानव जीवन केवल भौतिक सुखों के लिए नहीं, बल्कि आत्म-कल्याण और ईश्वर प्राप्ति के लिए मिला है, जिसे लोग व्यर्थ गंवा रहे हैं।" },
                    { q: "प्रश्न 7: कबीरदास जी की भाषा शैली (सधुक्कड़ी/पंचमेल खिचड़ी) की मुख्य विशेषताएं क्या हैं और यह समाज के लिए क्यों उपयोगी थी?", ans: "उत्तर: कबीरदास जी घुमक्कड़ संत थे, इसलिए उनकी भाषा में अवधी, भोजपुरी, पंजाबी, राजस्थानी और अरबी-फारसी के शब्दों का मिश्रण है, जिसे 'सधुक्कड़ी' या 'पंचमेल खिचड़ी' कहा जाता है। यह शैली समाज के साधारण और अनपढ़ लोगों के लिए भी बहुत सरल और बोधगम्य थी, जिससे उनके उपदेश सीधे जनमानस के दिलों तक पहुँचते थे।" },
                    { q: "प्रश्न 8: 'बिरह भुवंगम तन बसै, मंत्र न लागै कोइ'—इस पंक्ति में राम के वियोगी की स्थिति का क्या चित्रण किया गया है?", ans: "उत्तर: कबीर कहते हैं कि जिसके शरीर में परमात्मा के विरह (अलग होने का दुःख) रूपी सांप बस जाता है, उस पर कोई भी दवा या मंत्र काम नहीं करता। ईश्वर के प्रेम में व्याकुल व्यक्ति या तो समाज के सामान्य व्यवहार के लिए जीवित नहीं रहता, और यदि वह जीवित रहता भी है, तो संसार के लोग उसे पागल समझने लगते हैं। परमात्मा की भक्ति में वह सब कुछ भूल जाता है।" },
                    { q: "प्रश्न 9: कबीरदास जी के अनुसार बाह्य आडंबरों (दिखावे की भक्ति) का खंडन किस प्रकार किया गया है? एक दोहे का उदाहरण देकर स्पष्ट करें।", ans: "उत्तर: कबीर आंतरिक पवित्रता पर बल देते हैं और तिलक लगाने, माला जपने या ऊंचे स्वर में अज़ान देने जैसे बाहरी दिखावों का विरोध करते हैं। वे कहते हैं कि मन को साफ किए बिना केवल हाथों में माला फेरने और जीभ से राम-नाम जपने से कुछ नहीं होता, यदि हमारा मन चारों दिशाओं में सांसारिक विकारों में भटक रहा हो।" },
                    { q: "प्रश्न 10: साखी का अर्थ क्या है? कबीर की 'साखियों' का आधुनिक समाज के लिए क्या संदेश और प्रासंगिकता है?", ans: "उत्तर: 'साखी' शब्द 'साक्षी' (Witness) का अपभ्रंश है, जिसका अर्थ है आँखों देखा सत्य। कबीर की साखियां आज के आधुनिक समाज के लिए भी अत्यंत प्रासंगिक हैं क्योंकि वे जाति-पाति का भेद मिटाने, आपसी प्रेम बढ़ाने, अहंकार को त्यागने और ढोंग-दिखावे को छोड़कर एक सच्चा और ईमानदार इंसान बनने का सार्वभौमिक संदेश देती हैं।" }
                ]
            },

        function initDashboard() {
            const gadhyaGrid = document.getElementById('gadhya-grid');
            const padhyaGrid = document.getElementById('padhya-grid');
            gadhyaGrid.innerHTML = ""; padhyaGrid.innerHTML = "";

            for (let key in hindiDatabase) {
                const ch = hindiDatabase[key];
                const card = document.createElement('div');
                card.className = "subject-card";
                card.innerHTML = `
                    <div>
                        <h3>${ch.title}</h3>
                        <p>${ch.sub}</p>
                    </div>
                    <button class="practice-btn" onclick="openArena('${key}')">Open Questions</button>
                `;
                if(ch.type === "gadhya") gadhyaGrid.appendChild(card);
                else padhyaGrid.appendChild(card);
            }
        }

        function openArena(key) {
            document.getElementById('hindi-dashboard').style.display = "none";
            document.getElementById('practice-arena').style.display = "block";
            
            const ch = hindiDatabase[key];
            document.getElementById('arena-title').innerText = ch.title;
            document.getElementById('arena-subtitle').innerText = ch.sub;

            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            if(!ch.questions || ch.questions.length === 0) {
                container.innerHTML = "<div class='q-title' style='color: var(--text-sub);'>इस अध्याय के दीर्घ उत्तरीय प्रश्न (Long Answers) जल्द ही जोड़े जाएंगे। तब तक पाठ 1 और 11 का अभ्यास करें!</div>";
                return;
            }

            ch.questions.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = "question-box";
                box.innerHTML = `
                    <div class="q-title">${item.q}</div>
                    <button class="show-ans-btn" onclick="toggleAnswer(this)">Show Model Answer</button>
                    <div class="answer-content">${item.ans}</div>
                `;
                container.appendChild(box);
            });
        }

        function toggleAnswer(btn) {
            const ansContent = btn.nextElementSibling;
            if (ansContent.style.display === "block") {
                ansContent.style.display = "none";
                btn.innerText = "Show Model Answer";
            } else {
                ansContent.style.display = "block";
                btn.innerText = "Hide Answer";
            }
        }

        function closeArena() {
            document.getElementById('practice-arena').style.display = "none";
            document.getElementById('hindi-dashboard').style.display = "block";
        }

        initDashboard();

                questions: [
                    { q: "प्रश्न 1: श्यामु ने सुबह उठते ही अपनी मां (उमा) को फर्श पर कंबल पर लेटे क्यों देखा? घर में कोहराम क्यों मचा था?", ans: "उत्तर: श्यामु ने सुबह उठकर देखा कि उसकी माँ उमा नीचे फर्श पर एक कंबल पर लेटी हुई हैं और उनके ऊपर एक राम-नामी कपड़ा ढका हुआ है। घर के लोग उन्हें घेरकर बहुत रो रहे थे। ऐसा इसलिए था क्योंकि श्यामु की माँ की मृत्यु हो चुकी थी। श्यामु अभी बहुत छोटा था, इसलिए उसे इस बात का ज्ञान नहीं था कि उसकी माँ अब इस दुनिया में नहीं रहीं।" },
                    { q: "प्रश्न 2: श्यामु को उसकी माँ की मृत्यु के विषय में क्या सांत्वना दी गई और बाद में उसे सच्चाई का पता कैसे चला?", ans: "उत्तर: जब श्यामु की माँ को श्मशान ले जाया जा रहा था, तो बुद्धिमान लोगों ने श्यामु को बहलाने के लिए कहा कि उसकी काकी उसके मामा के घर गई हैं। परंतु बाद में अपने साथ के हमउम्र बच्चों से उसे यह कड़वी सच्चाई पता चल गई कि उसकी काकी मामा के यहाँ नहीं, बल्कि भगवान के यहाँ (स्वर्ग में) गई हैं।" },
                    { q: "प्रश्न 3: उड़ती हुई पतंग को देखकर श्यामु के मन में क्या विचार आया और उसने क्या योजना बनाई?", ans: "उत्तर: एक दिन श्यामु ने आकाश में एक पतंग उड़ती हुई देखी। पतंग को देखते ही उसका दुखी हृदय एकदम खिल उठा। उसने सोचा कि यदि वह एक पतंग आसमान में उड़ाए, तो उसकी डोर पकड़कर उसकी काकी (माँ) राम जी के यहाँ से सीधे नीचे उतर आएगी। उसने काकी को वापस पाने के लिए पतंग मंगाने की गुप्त योजना बनाई।" },
                    { q: "प्रश्न 4: पतंग मंगाने के लिए श्यामु ने पहली बार क्या किया? इससे उसकी किस मानसिक दशा का पता चलता है?", ans: "उत्तर: श्यामु अपने पिता से पतंग मांगने का साहस नहीं कर पा रहा था क्योंकि उसके पिता खुद काकी की मृत्यु के बाद उदास रहते थे। इसलिए उसने पिता जवाहर जी के कोट की जेब से चुपके से एक चवन्नी चुरा ली। इससे पता चलता है कि श्यामु अपनी माँ से मिलने के लिए कितना व्याकुल और बेताब था, जिसके कारण उसने चोरी जैसा गलत काम भी कर दिया।" },
                    { q: "प्रश्न 5: भोला कौन था? उसने श्यामु की योजना में क्या व्यावहारिक (practical) कमी या कठिनाई बताई?", ans: "उत्तर: भोला सुखिया दासी का बेटा था और श्यामु का पक्का दोस्त था। जब श्यामु ने उसे अपनी योजना बताई, तो भोला ने कहा कि योजना तो बहुत अच्छी है, लेकिन एक कठिनाई है। पतंग की सूती रस्सी बहुत पतली और कमजोर है। इसे पकड़कर नीचे उतरने में रस्सी टूट जाएगी और काकी बीच में ही गिर पड़ेंगी। इसलिए एक मोटी और मजबूत रस्सी की आवश्यकता है।" },
                    { q: "प्रश्न 6: मोटी रस्सी का प्रबंध करने के लिए श्यामु ने दोबारा क्या कदम उठाया और भोला को क्या निर्देश दिए?", ans: "उत्तर: भोला की बात सुनकर श्यामु गहरी चिंता में पड़ गया। मोटी रस्सी खरीदने के लिए पैसों की जरूरत थी। इसलिए उसने दोबारा अपने पिता की जेब से एक रुपया निकाला। उसने वह रुपया भोला को देते हुए कहा कि वह चुपचाप बाजार से दो मोटी रस्सियां ला दे और ध्यान रखे कि किसी को भी इस बात की भनक न लगे।" },
                    { q: "प्रश्न 7: जवाहर जी को श्यामु की चोरी का पता कैसे चला और उन्होंने श्यामु के साथ कैसा व्यवहार किया?", ans: "उत्तर: जवाहर जी को जब अपनी जेब से एक रुपया गायब होने का पता चला, तो उन्होंने दासी से पूछा। दासी ने भोला का नाम लिया। जवाहर जी ने जब भोला को धमकाया, तो उसने डर के मारे सच उगल दिया कि श्यामु ने रस्सी और पतंग के लिए पैसे निकाले थे। यह सुनकर जवाहर जी क्रोधित हो गए, उन्होंने श्यामु को दो तमाचे मारे और उसकी पतंग फाड़ दी।" },
                    { q: "प्रश्न 8: फटी हुई पतंग पर लिखे शब्द को देखकर जवाहर जी की क्या दशा हुई और क्यों?", ans: "उत्तर: जब जवाहर जी ने फटी हुई पतंग को उठाया, तो उन्होंने देखा कि उस पर एक कागज चिपका था जिस पर लिखा था— 'काकी'। यह शब्द देखते ही जवाहर जी का सारा क्रोध तुरंत शांत हो गया और वे हतबुद्धि (स्तब्ध) होकर वहीं खड़े रह गए। उन्हें अपनी गलती का एहसास हुआ और बालक का अपनी मां के प्रति निश्चल प्रेम देखकर उनकी आंखें भर आईं।" },
                    { q: "प्रश्न 9: 'काकी' कहानी के माध्यम से लेखक सियारामशरण गुप्त जी ने क्या संदेश दिया है?", ans: "उत्तर: इस कहानी का मुख्य संदेश यह है कि बच्चों का हृदय अत्यंत कोमल, मासूम और संवेदनशील होता है। वे अपनों के बिछड़ने का दुख सहन नहीं कर पाते। बड़ों को बच्चों की भावनाओं का आदर करना चाहिए। साथ ही, कहानी यह भी सिखाती है कि बाहरी रूप से जो कार्य अपराध (चोरी) जैसा दिखता है, उसके पीछे कभी-कभी एक मासूम बच्चे का पवित्र और निश्चल उद्देश्य छिपा हो सकता है।" },
                    { q: "प्रश्न 10: श्यामु और भोला के चरित्र की तुलना कीजिए। दोनों में क्या अंतर था?", ans: "उत्तर: श्यामु अत्यंत भावुक, अपनी माँ के वियोग में डूबा हुआ और कल्पनाशील बालक था जो अंधविश्वास में भी विश्वास कर लेता है। वहीं दूसरी ओर, भोला अधिक यथार्थवादी (practical) और समझदार था। वह जानता था कि पतली रस्सी टूट सकती है। हालांकि भोला डरपोक भी था, क्योंकि जवाहर जी की एक ही धमकी में उसने श्यामु का सारा राज उगल दिया, जबकि श्यामु साहसी और अपने लक्ष्य के प्रति अडिग था।" }
                ]
            },
            maha_yajna: {

                sub: "परोपकार, जीवों पर दया और निस्वार्थ कर्म के फल पर आधारित दीर्घ उत्तरीय प्रश्न",
                questions: [
                    { q: "प्रश्न 1: धन्ना सेठ की पत्नी के बारे में कौन सी अफवाह या बात प्रसिद्ध थी? सेठ जी उनके पास क्यों गए थे?", ans: "उत्तर: कुंदनपुर के धन्ना सेठ की पत्नी के बारे में यह बात प्रसिद्ध थी कि उन्हें कोई दैवीय शक्ति प्राप्त है, जिससे वे तीनों लोकों की बात जान लेती हैं और यह भी अफवाह थी कि वे लोगों के यज्ञों को खरीदती और बेचती हैं। हमारे मुख्य पात्र सेठ जी अत्यधिक गरीबी के कारण अपने एक यज्ञ को बेचने के लिए धन्ना सेठ के पास गए थे ताकि कुछ पैसे मिल सकें।" },
                    { q: "प्रश्न 2: सेठ जी जब कुंदनपुर जा रहे थे, तो रास्ते में उन्होंने ठहरने का विचार क्यों किया? उनके पास खाने के लिए क्या था?", ans: "उत्तर: कुंदनपुर सेठ जी के घर से बहुत दूर था। चलते-चलते दोपहर हो गई थी और धूप बहुत तेज थी। सेठ जी को थकान महसूस होने लगी थी, इसलिए उन्होंने रास्ते में एक चिनार के पेड़ के नीचे बैठकर आराम करने और भोजन करने का विचार किया। उनकी पत्नी ने रास्ते के लिए उन्हें आटे की चार मोटी-मोटी रोटियां बनाकर दी थीं।" },
                    { q: "प्रश्न 3: कुएं के पास भोजन करते समय सेठ जी ने किस जीव को देखा और उसकी क्या स्थिति थी?", ans: "उत्तर: सेठ जी ने जब रोटी खाने के लिए हाथ बढ़ाया, तो उन्होंने देखा कि थोड़ी दूरी पर एक कुत्ता पड़ा छटपटा रहा है। वह कुत्ता भूख के कारण अत्यंत कमजोर हो गया था, उसका पेट पीठ से सटा हुआ था और वह इतना लाचार था कि अपनी गर्दन भी नहीं उठा पा रहा था। वह केवल अपनी आंखों से दया की भीख मांग रहा था।" },
                    { q: "प्रश्न 4: सेठ जी ने भूखे कुत्ते की मदद किस प्रकार की? उन्होंने रोटियों का वितरण कैसे किया?", ans: "उत्तर: सेठ जी अत्यंत दयालु स्वभाव के थे। कुत्ते की दयनीय दशा देखकर उन्होंने अपनी एक रोटी के टुकड़े करके उसके सामने डाल दिए। कुत्ता उसे खाकर थोड़ा संभला। फिर सेठ जी ने दूसरी और तीसरी रोटी भी उसे खिला दी ताकि वह चलने-फिरने लायक हो सके। अंत में, उन्होंने देखा कि कुत्ता अभी भी उनकी ओर देख रहा है, तो उन्होंने अपनी चौथी और आखिरी रोटी भी उसे दे दी और स्वयं केवल पानी पीकर रह गए।" },
                    { q: "प्रश्न 5: धन्ना सेठ की पत्नी ने सेठ जी से कौन सा यज्ञ खरीदने की इच्छा जताई और सेठ जी पर इसकी क्या प्रतिक्रिया हुई?", ans: "उत्तर: धन्ना सेठ की पत्नी ने सेठ जी से कहा कि वे उनका आज ही किया हुआ 'महायज्ञ' खरीदना चाहती हैं। यह सुनकर सेठ जी आश्चर्यचकित और दुखी हो गए। उन्होंने सोचा कि उन्होंने तो वर्षों से कोई यज्ञ नहीं किया है क्योंकि उनके पास पैसे ही नहीं थे, फिर सेठानी आज के किस यज्ञ की बात कर रही हैं। वे इसे एक क्रूर मजाक समझने लगे।" },
                    { q: "प्रश्न 6: सेठानी के अनुसार 'सच्चा महायज्ञ' क्या है? उन्होंने सेठ जी के किस कार्य को महायज्ञ कहा?", ans: "उत्तर: सेठानी ने स्पष्ट किया कि केवल धन-दौलत खर्च करके, दिखावे के लिए किए गए यज्ञ सच्चे यज्ञ नहीं होते। निस्वार्थ भाव से, बिना किसी फल की इच्छा के, किसी भूखे और लाचार जीव के प्राण बचाना ही 'सच्चा महायज्ञ' है। सेठ जी ने स्वयं भूखे रहकर अपनी चारों रोटियां एक मरते हुए कुत्ते को खिला दीं, यही उनका महायज्ञ था।" },
                    { q: "प्रश्न 7: सेठ जी ने अपना महायज्ञ बेचने से क्यों मना कर दिया? इससे उनके चरित्र की किस विशेषता का पता चलता है?", ans: "उत्तर: सेठ जी का मानना था कि किसी भूखे जीव को भोजन कराना उनका मानवीय कर्तव्य था, कोई व्यापार नहीं। वे अपने इस पुण्य कर्म को पैसों के लिए बेचना उचित नहीं समझते थे। इसलिए वे बिना यज्ञ बेचे, खाली हाथ भूखे ही अपने घर वापस लौट आए। इससे उनके चरित्र की परम संतोषी प्रवृत्ति, निस्वार्थता और सच्ची धार्मिक भावना का पता चलता है।" },
                    { q: "प्रश्न 8: सेठ जी जब खाली हाथ घर लौटे, तो उनकी पत्नी ने उनका स्वागत किस प्रकार किया? उसने क्या कहा?", ans: "उत्तर: जब सेठ जी कुंदनपुर से भूखे-प्यासे खाली हाथ घर लौटे, तो उनकी पत्नी ने उनके चेहरे पर उदासी देखी। सच जानने पर कि उन्होंने अपना कर्तव्य नहीं बेचा, सेठानी का मस्तक गर्व से ऊंचा हो गया। उसने अपने पति को ढाढस बंधाया और कहा कि विपत्ति में भी उन्होंने अपने धर्म को नहीं छोड़ा, यह सबसे बड़ी बात है।" },
                    { q: "प्रश्न 9: कहानी के अंत में सेठ जी के घर में जो चमत्कार हुआ, उसका संक्षिप्त वर्णन कीजिए।", ans: "उत्तर: रात के समय जब सेठानी रसोई में दीया जलाने जा रही थी, तो उसका पैर फर्श के एक उभरे हुए पत्थर से टकराया। ध्यान से देखने पर वहां एक लोहे का कुंडा दिखा। जब उन्होंने पत्थर को उठाया, तो नीचे एक गुप्त तहखाना मिला जो बेशकीमती सोने, चांदी और हीरे-जवाहरात से भरा हुआ था। वहां एक अदृश्य आवाज गूंजी कि यह तुम्हारे निस्वार्थ महायज्ञ का पुरस्कार है।" },
                    { q: "प्रश्न 10: 'महायज्ञ का पुरस्कार' कहानी का मुख्य उद्देश्य और संदेश क्या है?", ans: "उत्तर: इस कहानी का मुख्य उद्देश्य समाज को यह सिखाना है कि परोपकार और जीव-दया ही मानव का सबसे बड़ा धर्म है। ईश्वर दिखावे की पूजा-पाठ से नहीं, बल्कि निस्वार्थ भाव से की गई सेवा से प्रसन्न होते हैं। जो मनुष्य बिना किसी स्वार्थ के दूसरों की मदद करता है, उसे उसका फल (पुरस्कार) ईश्वर के द्वारा किसी न किसी रूप में अवश्य मिलता है।" ]
                ]
            },

                sub: "देशभक्ति, कैप्टन का चरित्र और राष्ट्रीय प्रतीकों के सम्मान पर आधारित दीर्घ उत्तरीय प्रश्न",
                questions: [
                    { q: "प्रश्न 1: हालदार साहब कौन थे और वे हर पंद्रहवें दिन उस कस्बे से क्यों गुजरते थे? कस्बे का संक्षिप्त विवरण दीजिए।", ans: "उत्तर: हालदार साहब एक कंपनी में बड़े पद पर कार्यरत थे और अपनी कंपनी के काम के सिलसिले में उन्हें हर पंद्रहवें दिन एक छोटे से कस्बे से गुजरना पड़ता था। वह कस्बा बहुत बड़ा नहीं था। वहां कुछ पक्के मकान, एक छोटा सा बाजार, लड़कों और लड़कियों का एक-एक स्कूल, एक सीमेंट का छोटा सा कारखाना, दो ओपन-एयर सिनेमाघर और एक नगरपालिका थी।" },
                    { q: "प्रश्न 2: कस्बे के मुख्य बाजार के चौराहे पर किसकी मूर्ति लगी थी और उस मूर्ति में क्या कमी या अनोखी बात थी?", ans: "उत्तर: कस्बे के मुख्य बाजार के चौराहे पर राष्ट्रभक्त नेताजी सुभाष चंद्र बोस की एक संगमरमर की प्रतिमा (मूर्ति) लगी थी। मूर्ति टोपी की नोक से कोट के दूसरे बटन तक कोई दो फुट ऊंची थी, जिसे 'बस्ट' कहते हैं। उस मूर्ति में सबसे अनोखी बात यह थी कि नेताजी की आँखों पर संगमरमर का चश्मा नहीं था, बल्कि उसकी जगह एक असली, चौड़ा और काला फ्रेम वाला चश्मा पहनाया गया था।" },
                    { q: "प्रश्न 3: हालदार साहब के मन में पहली बार कौतुक (curiosity) क्यों उत्पन्न हुआ? मूर्ति को देखकर उन्होंने क्या टिप्पणी की?", ans: "उत्तर: जब हालदार साहब ने पहली बार चौराहे पर रुककर पान खाया और मूर्ति को देखा, तो वे चकित रह गए। उन्होंने देखा कि मूर्ति पत्थर की है, लेकिन उस पर चश्मा असली है। उनके चेहरे पर एक कौतुकभरी मुस्कानैल फैल गई। उन्होंने मुस्कुराते हुए कहा— 'वाह भाई, यह आइडिया भी ठीक है! मूर्ति पत्थर की, पर चश्मा रियल!'" },
                    { q: "प्रश्न 4: पानवाले का रेखाचित्र (character sketch) अपने शब्दों में खींचिए। उसका स्वभाव कैसा था?", ans: "उत्तर: पानवाला कस्बे के चौराहे पर दुकान लगाता था। वह स्वभाव से बहुत खुशमिजाज, बातूनी और मजाकिया इंसान था। शारीरिक रूप से वह एक मोटा, काला आदमी था, जिसकी तोंद निकली हुई थी। जब वह हंसता था, तो उसकी तोंद थिरकती थी। ज्यादा पान खाने के कारण उसके दांत लाल-काले हो चुके थे। वह कस्बे की हर खबर रखता था।" },
                    { q: "प्रश्न 5: कैप्टन कौन था और वह नेताजी की मूर्ति का चश्मा बार-बार क्यों बदल देता था?", ans: "उत्तर: कैप्टन कोई फौज का सिपाही नहीं था, बल्कि वह एक बूढ़ा, लंगड़ा और मरियल सा फेरी लगाने वाला चश्मे विक्रेता था। उसके हृदय में देशभक्ति की अटूट भावना थी। उसे नेताजी की बिना चश्मे वाली मूर्ति अधूरी और आहत करती थी। इसलिए वह अपनी छोटी सी दुकान से एक फ्रेम नेताजी को पहना देता था। जब किसी ग्राहक को वैसा ही फ्रेम चाहिए होता, तो वह मूर्ति से उतारकर ग्राहक को दे देता और नेताजी से क्षमा मांगते हुए नया फ्रेम लगा देता था।" },
                    { q: "प्रश्न 6: पानवाले द्वारा कैप्टन को 'लंगड़ा' और 'पागल' कहना कहाँ तक उचित था? हालदार साहब की इस पर क्या प्रतिक्रिया थी?", ans: "उत्तर: पानवाले द्वारा एक सच्चे देशभक्त को 'लंगड़ा' या 'पागल' कहना अत्यंत अनुचित, निंदनीय और संवेदनहीन था। कैप्टन शारीरिक रूप से भले ही कमजोर था, लेकिन उसका मानसिक स्तर और देशभक्ति समाज में सबसे ऊंची थी। हालदार साहब को एक देशभक्त का इस तरह मजाक उड़ाया जाना बिल्कुल अच्छा नहीं लगा और वे दुखी हो गए।" },
                    { q: "प्रश्न 7: एक बार जब हालदार साहब कस्बे से गुजरे, तो मूर्ति पर चश्मा क्यों नहीं था? उन्हें क्या दुखद समाचार मिला?", ans: "उत्तर: एक बार जब हालदार साहब कस्बे में आए, तो उन्होंने देखा कि चौराहे की रौनक गायब थी और नेताजी की आंखों पर कोई चश्मा नहीं था। जब उन्होंने पानवाले से इसका कारण पूछा, तो पानवाले ने उदास होकर, अपनी धोती के कोने से आँखें पोंछते हुए बताया कि 'साहब, कैप्टन मर गया।' यह सुनकर हालदार साहब अत्यंत दुखी और स्तब्ध हो गए।" },
                    { q: "प्रश्न 8: कहानी के अंत में हालदार साहब ने मूर्ति पर क्या देखा जिससे उनकी आँखें भर आईं? इसका क्या महत्व है?", ans: "उत्तर: कैप्टन की मृत्यु के बाद हालदार साहब ने सोचा था कि अब वे चौराहे पर नहीं रुकेंगे क्योंकि मूर्ति पर चश्मा नहीं होगा। लेकिन आदत से मजबूर जब उन्होंने मूर्ति की ओर देखा, तो वे चौंक गए। मूर्ति की आँखों पर किसी बच्चे ने सरकंडे (घास-फूस) से बना एक छोटा सा चश्मा पहना रखा था। यह देखकर हालदार साहब भावुक हो गए और उनकी आँखें भर आईं।" },
                    { q: "प्रश्न 9: सरकंडे का चश्मा देखकर हालदार साहब को क्या तसल्ली मिली? इससे देश के भविष्य के बारे में क्या पता चलता है?", ans: "उत्तर: सरकंडे का चश्मा इस बात का प्रतीक था कि कैप्टन के मरने के बाद भी देश में देशभक्ति मरी नहीं है। देश की नई पीढ़ी यानी बच्चों के भीतर भी नेताजी और राष्ट्र के प्रति सम्मान की भावना जीवित है। इससे हालदार साहब को यह तसल्ली मिली कि हमारे देश का भविष्य सुरक्षित हाथों में है।" },
                    { q: "प्रश्न 10: 'नेताजी का चश्मा' कहानी का मुख्य संदेश और उद्देश्य क्या है?", ans: "उत्तर: इस कहानी का मुख्य उद्देश्य यह बताना है कि देशभक्ति केवल सीमा पर बंदूक लेकर खड़े होने का नाम नहीं है। अपने देश के महापुरुषों, राष्ट्रीय प्रतीकों और राष्ट्र की संपत्ति का सम्मान करना भी देशभक्ति है। समाज का हर नागरिक, चाहे वह बूढ़ा हो, लंगड़ा हो या एक छोटा बच्चा, अपने-अपने तरीके से देश के निर्माण में योगदान दे सकता है। हमें देशभक्तों का सम्मान करना चाहिए।" ]
                ]
            },
