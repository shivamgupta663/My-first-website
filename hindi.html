    <script>
        // SUBJECTIVE HINDI LONG ANSWERS DATABASE
        const hindiDatabase = {
            baat_athanni_ki: {
                title: "1. बात अठन्नी की (सुदर्शन)",
                type: "gadhya",
                sub: "चरित्र चित्रण, रिश्वतखोरी एवं न्याय व्यवस्था पर आधारित दीर्घ उत्तरीय प्रश्न",
                questions: [
                    { q: "प्रश्न 1: रसीला कौन था और उसकी पारिवारिक स्थिति का वर्णन कीजिए? वह अपने वेतन से असंतुष्ट क्यों था?", ans: "उत्तर: रसीला बाबू जगतसिंह के यहाँ दस रुपये मासिक वेतन पर रसोइया था। उसके परिवार में बूढ़े पिता, एक पत्नी, एक लड़की और दो लड़के थे, जो गाँव में रहते थे। उसका पूरा वेतन परिवार के भरण-पोषण के लिए कम पड़ता था। वह अपने वेतन से इसलिए असंतुष्ट था क्योंकि उसके मालिक (इंजीनियर बाबू) उसकी वर्षों की सेवा के बावजूद उसका वेतन बढ़ाने को तैयार नहीं थे, जबकि रसीला को अपने बीमार बच्चों के इलाज के लिए अधिक पैसों की आवश्यकता थी।" },
                    { q: "प्रश्न 2: रमजान ने रसीला की उदासी का कारण जानकर उसकी मदद किस प्रकार की? इससे रमजान के चरित्र की किस विशेषता का पता चलता है?", ans: "उत्तर: रमजान ने जब देखा कि रसीला अपने बच्चों की बीमारी और पैसों की तंगी के कारण बहुत उदास है, तो उसने बिना किसी संकोच के अपनी कोठरी से लाकर साढ़े चार रुपये रसीला के हाथ पर रख दिए। इससे रमजान के चरित्र की निस्वार्थता, सच्ची मित्रता और संवेदनशीलता का पता चलता है। वह स्वयं एक मामूली चौकीदार था, फिर भी उसने धर्म या जाति की परवाह किए बिना संकट के समय अपने मित्र की आर्थिक सहायता की।" },
                    { q: "प्रश्न 3: 'बात अठन्नी की' कहानी के आधार पर बाबू जगतसिंह और शेख सलीमुद्दीन के माध्यम से समाज के किस कड़वे सच को उजागर किया गया है?", ans: "उत्तर: कहानी में बाबू जगतसिंह (इंजीनियर) और शेख सलीमुद्दीन (जिला मजिस्ट्रेट) समाज के उच्च, प्रतिष्ठित लेकिन अत्यंत भ्रष्ट और सफेदपोश वर्ग का प्रतिनिधित्व करते हैं। लेखक ने दिखाया है कि ये लोग पर्दे के पीछे क्रमशः ₹500 और ₹1000 जैसी बड़ी-बड़ी रिश्वतें लेते हैं, लेकिन समाज में न्यायप्रिय होने का ढोंग करते हैं। यह कहानी समाज के इस दोहरे चरित्र और भ्रष्टाचार को उजागर करती है।" },
                    { q: "प्रश्न 4: रसीला द्वारा की गई अठन्नी की चोरी का पूरा घटनाक्रम क्या था? वह चोरी करने पर मजबूर क्यों हुआ?", ans: "उत्तर: रसीला ने रमजान का लगभग पूरा कर्ज चुका दिया था, केवल आठ आने (अठन्नी) बाकी थे। एक दिन बाबू जगतसिंह ने रसीला को पांच रुपये देकर मिठाई लाने भेजा। रसीला ने रमजान का कर्ज उतारने की जल्दी में साढ़े चार रुपये की मिठाई ली और बचे हुए आठ आने रमजान को दे दिए। रसीला कोई पेशेवर चोर नहीं था, बल्कि वह कर्ज के बोझ और अपने ईमान को साफ करने की व्याकुलता के कारण इस छोटी सी हेराफेरी को कर बैठा।" },
                    { q: "प्रश्न 5: बाबू जगतसिंह ने रसीला का अपराध जानने पर उसके साथ कैसा व्यवहार किया? क्या उनका यह व्यवहार न्यायसंगत था?", ans: "उत्तर: हलवाई से सच जानने के बाद बाबू जगतसिंह ने रसीला को निर्दयता से पीटा, उसे घसीटते हुए पुलिस थाने ले गए और सिपाही को पाँच रुपये की रिश्वत देकर रसीला से जुर्म कबूलवाने को कहा। उनका यह व्यवहार बिल्कुल भी न्यायसंगत नहीं था, क्योंकि एक वफादार नौकर जिसने सालों सेवा की, उसकी मजबूरी समझे बिना एक अठन्नी के लिए उसे जानवरों की तरह पीटना उनकी क्रूरता और संवेदनहीनता को दर्शाता है।" },
                    { q: "प्रश्न 6: अदालत में रसीला ने अपना जुर्म क्यों कबूल कर लिया? उसके इस कदम से उसके स्वभाव के बारे में क्या पता चलता है?", ans: "उत्तर: अदालत में रसीला चाहता तो मजिस्ट्रेट के सामने झूठ बोल सकता था, लेकिन उसने अपना अपराध स्वीकार कर लिया और कहा कि 'माई बाप, गलती हो गई, पहली बार हुई है, माफ़ कर दें।' इससे पता चलता है कि रसीला के भीतर अभी भी सच्चाई, ईमानदारी और पश्चाताप की भावना जीवित थी। वह चालाक अपराधियों की तरह झूठ बोलना नहीं जानता था।" },
                    { q: "प्रश्न 7: जिला मजिस्ट्रेट शेख सलीमुद्दीन द्वारा रसीला को दी गई सज़ा पर रमजान की क्या प्रतिक्रिया थी? 'आँखों में खून उतर आना' मुहावरे का महत्व स्पष्ट करें।", ans: "उत्तर: शेख सलीमुद्दीन ने रसीला को छह महीने की कठोर कैद की सजा सुनाई। यह सुनकर रमजान की आँखों में खून उतर आया, जिसका अर्थ है अत्यधिक क्रोध आना। रमजान को इस बात पर गहरा गुस्सा आया कि जो जज स्वयं हजारों की रिश्वत लेते हैं, वे एक गरीब को सिर्फ आठ आने की चोरी पर छह महीने के लिए जेल भेज रहे हैं। उसे यह न्याय नहीं, बल्कि अंधेर नगरी लगा।" },
                    { q: "प्रश्न 8: 'यह दुनिया इंसानों की नहीं, पशुओं की है। यहाँ केवल क्रूर और स्वार्थी लोग ही सुखी रह सकते हैं।' इस कथन के संदर्भ में कहानी का उद्देश्य स्पष्ट कीजिए।", ans: "उत्तर: इस कथन के माध्यम से लेखक ने समाज की संवेदनहीन न्याय व्यवस्था पर करारा व्यंग्य किया है। कहानी का उद्देश्य यह दिखाना है कि कानून और अदालतें केवल गरीबों को सजा देने के लिए हैं, जबकि समाज के बड़े-बड़े सफेदपोश अपराधी जो देश को लूट रहे हैं, वे ऊंचे पदों पर बैठकर मजे करते हैं। यहाँ गरीबों की लाचारी और ईमानदारी का कोई मूल्य नहीं है।" },
                    { q: "प्रश्न 9: 'बात अठन्नी की' शीर्षक की सार्थकता पर विचार कीजिए। क्या यह शीर्षक उचित है?", ans: "उत्तर: इस कहानी का शीर्षक 'बात अठन्नी की' पूर्णतः सार्थक और अत्यंत उपयुक्त है। पूरी कहानी इसी अठन्नी (आठ आने) के इर्द-गिर्द घूमती है। यही अठन्नी रसीला की ईमानदारी पर दाग लगाती है, इसी के कारण उसे छह महीने की जेल होती है और इसी अठन्नी के बहाने समाज के बड़े चोरों का असली चेहरा सामने आता है। यह छोटी सी रकम समाज के बड़े अन्याय को दर्शाने का माध्यम बनती है।" },
                    { q: "प्रश्न 10: कहानी के अंत में रमजान ने बड़ी कोठियों की ओर देखकर क्या टिप्पणी की और उसका क्या गूढ़ अर्थ था?", ans: "उत्तर: कहानी के अंत में रमजान कहता है- 'अरे, असली चोर तो बड़ी-बड़ी कोठियों में बैठकर मजे कर रहे हैं।' इसका गूढ़ अर्थ यह है कि समाज में न्याय का मापदंड अमीर और गरीब के लिए अलग है। महलों में रहने वाले लोग बड़े-बड़े घोटाले और रिश्वतखोरी करके भी समाज में इज्जत पाते हैं, जबकि भूखा-प्यासा गरीब यदि एक अठन्नी की भूल कर दे, तो उसे अपराधी घोषित कर दिया जाता है।" }
                ]
            },
            sakhi: {
                title: "11. साखी (कबीरदास)",
                type: "padhya",
                sub: "दोहे, गुरु महिमा, ईश्वर भक्ति और व्यावहारिक ज्ञान पर आधारित दीर्घ उत्तरीय प्रश्न",
                questions: [
                    { q: "प्रश्न 1: कबीरदास जी ने अपने दोहों में गुरु को गोविंद (ईश्वर) से भी श्रेष्ठ क्यों माना है? इसके पीछे क्या तर्क है?", ans: "उत्तर: कबीरदास जी के अनुसार, यदि गुरु और ईश्वर दोनों एक साथ सामने खड़े हों, तो सबसे पहले गुरु के चरण छूने चाहिए। इसके पीछे तर्क यह है कि गुरु ही वह माध्यम है जिन्होंने हमें ज्ञान की आंखें दीं और ईश्वर को पहचानने और उन तक पहुँचने का मार्ग दिखाया। गुरु के बिना मनुष्य अज्ञान के अंधकार में भटका रहता है, इसलिए गुरु का स्थान ईश्वर से भी ऊपर है।" },
                    { q: "प्रश्न 2: 'जब मैं था तब हरि नहीं, अब हरि हैं मैं नाहिं'—इस पंक्ति का आध्यात्मिक अर्थ स्पष्ट कीजिए। यहाँ 'मैं' से क्या तात्पर्य है?", ans: "उत्तर: यहाँ 'मैं' का अर्थ 'अहंकार' (Ego) से है। कबीरदास जी कहते हैं कि जब तक मनुष्य के हृदय में अहंकार रहता है, तब तक वहाँ ईश्वर (हरि) का वास नहीं हो सकता। जब ज्ञान के प्रकाश से अहंकार पूरी तरह नष्ट हो जाता है, तब हृदय में ईश्वर का साक्षात्कार होता है। अहंकार और परमात्मा दोनों एक स्थान पर एक साथ कभी नहीं रह सकते।" },
                    { q: "प्रश्न 3: कबीर के अनुसार संसार के लोग अज्ञानता वश ईश्वर को कहाँ-कहाँ ढूंढते हैं, जबकि ईश्वर वास्तव में कहाँ निवास करते हैं?", ans: "उत्तर: अज्ञानता के कारण लोग ईश्वर को मंदिरों, मस्जिदों, तीर्थ स्थानों, जंगलों में या कठिन क्रियाओं में ढूंढते फिरते हैं। लेकिन कबीर कहते हैं कि 'कस्तूरी कुंडल बसै, मृग ढूंढे बन माहि'—जिस प्रकार हिरण अपनी ही नाभि में छिपी कस्तूरी की खुशबू के लिए पूरे जंगल में भटकता है, उसी प्रकार ईश्वर हर मनुष्य के हृदय के भीतर (घट-घट में) निवास करते हैं, उन्हें बाहर खोजना व्यर्थ है।" },
                    { q: "प्रश्न 4: 'पोथी पढ़ि पढ़ि जग मुआ, पंडित भया न कोइ'—इस साखी के माध्यम से कबीर किस प्रकार के ज्ञान को महत्व देते हैं?", ans: "उत्तर: इस साखी के माध्यम से कबीर किताबी या शास्त्रीय ज्ञान का खंडन करते हैं। वे कहते हैं कि बड़ी-बड़ी पुस्तकें या वेद पढ़ लेने से कोई विद्वान या सच्चा मनुष्य नहीं बन जाता। वास्तविक ज्ञानी या पंडित वह है जो 'ढाई आखर प्रेम का' पढ़ ले, अर्थात जो मानवता, प्रेम, करुणा और सहानुभूति के व्यावहारिक ज्ञान को अपने जीवन में उतार ले।" },
                    { q: "प्रश्न 5: कबीरदास जी ने 'निंदक' (आलोचना करने वाले) को अपने पास रखने की सलाह क्यों दी है? उसे कहाँ स्थान देना चाहिए?", ans: "उत्तर: कबीर का मानना है कि निंदक (आलोचक) को हमेशा अपने पास, यहाँ तक कि अपने आंगन में कुटिया बनवाकर रखना चाहिए। इसका कारण यह है कि निंदक बिना साबुन और पानी के हमारी कमियों को बताकर हमारे स्वभाव को साफ और निर्मल बना देता है। उसकी आलोचनाओं को सुनकर हम अपनी गलतियों को सुधार सकते हैं, जिससे हमारा आत्म-विकास होता है।" },
                    { q: "प्रश्न 6: 'सुखिया सब संसार है, खावै औरु सोवै'—इस पंक्ति में कबीरदास जी के रोने और जागने का क्या कारण है? आम लोग उनसे अलग कैसे हैं?", ans: "उत्तर: आम संसारी लोग केवल खाने, पीने और सोने को ही जीवन का परम सुख मानकर अज्ञान की नींद में सो रहे हैं और खुश हैं। लेकिन कबीर दास जी संसार की इस नश्वरता और मनुष्यों के भटकाव को देखकर जाग रहे हैं और रो रहे हैं। वे जानते हैं कि मानव जीवन केवल भौतिक सुखों के लिए नहीं, बल्कि आत्म-कल्याण और ईश्वर प्राप्ति के लिए मिला है, जिसे लोग व्यर्थ गंवा रहे हैं।" },
                    { q: "प्रश्न 7: कबीरदास जी की भाषा शैली (सधुक्कड़ी/पंचमेल खिचड़ी) की मुख्य विशेषताएं क्या हैं और यह समाज के लिए क्यों उपयोगी थी?", ans: "उत्तर: कबीरदास जी घुमक्कड़ संत थे, इसलिए उनकी भाषा में अवधी, भोजपुरी, पंजाबी, राजस्थानी और अरबी-फारसी के शब्दों का मिश्रण है, जिसे 'सधुक्कड़ी' या 'पंचमेल खिचड़ी' कहा जाता है। यह शैली समाज के साधारण और अनपढ़ लोगों के लिए भी बहुत सरल और बोधगम्य थी, जिससे उनके उपदेश सीधे जनमानस के दिलों तक पहुँचते थे।" },
                    { q: "प्रश्न 8: 'बिरह भुवंगम तन बसै, मंत्र न लागै कोइ'—इस पंक्ति में राम के वियोगी की स्थिति का क्या चित्रण किया गया है?", ans: "उत्तर: कबीर कहते हैं कि जिसके शरीर में परमात्मा के विरह (अलग होने का दुःख) रूपी सांप बस जाता है, उस पर कोई भी दवा या मंत्र काम नहीं करता। ईश्वर के प्रेम में व्याकुल व्यक्ति या तो समाज के सामान्य व्यवहार के लिए जीवित नहीं रहता, और यदि वह जीवित रहता भी है, तो संसार के लोग उसे पागल समझने लगते हैं। परमात्मा की भक्ति में वह सब कुछ भूल जाता है।" },
                    { q: "प्रश्न 9: कबीरदास जी के अनुसार बाह्य आडंबरों (दिखावे की भक्ति) का खंडन किस प्रकार किया गया है? एक दोहे का उदाहरण देकर स्पष्ट करें।", ans: "उत्तर: कबीर आंतरिक पवित्रता पर बल देते हैं और तिलक लगाने, माला जपने या ऊंचे स्वर में अज़ान देने जैसे बाहरी दिखावों का विरोध करते हैं। वे कहते हैं कि मन को साफ किए बिना केवल हाथों में माला फेरने और जीभ से राम-नाम जपने से कुछ नहीं होता, यदि हमारा मन चारों दिशाओं में सांसारिक विकारों में भटक रहा हो।" },
                    { q: "प्रश्न 10: साखी का अर्थ क्या है? कबीर की 'साखियों' का आधुनिक समाज के लिए क्या संदेश और प्रासंगिकता है?", ans: "उत्तर: 'साखी' शब्द 'साक्षी' (Witness) का अपभ्रंश है, जिसका अर्थ है आँखों देखा सत्य। कबीर की साखियां आज के आधुनिक समाज के लिए भी अत्यंत प्रासंगिक हैं क्योंकि वे जाति-पाति का भेद मिटाने, आपसी प्रेम बढ़ाने, अहंकार को त्यागने और ढोंग-दिखावे को छोड़कर एक सच्चा और ईमानदार इंसान बनने का सार्वभौमिक संदेश देती हैं।" }
                ]
            },

        function initDashboard() {
            const gadhyaGrid = document.getElementById('gadhya-grid');
            const padhyaGrid = document.getElementById('padhya-grid');
            gadhyaGrid.innerHTML = ""; padhyaGrid.innerHTML = "";

            for (let key in hindiDatabase) {
                const ch = hindiDatabase[key];
                const card = document.createElement('div');
                card.className = "subject-card";
                card.innerHTML = `
                    <div>
                        <h3>${ch.title}</h3>
                        <p>${ch.sub}</p>
                    </div>
                    <button class="practice-btn" onclick="openArena('${key}')">Open Questions</button>
                `;
                if(ch.type === "gadhya") gadhyaGrid.appendChild(card);
                else padhyaGrid.appendChild(card);
            }
        }

        function openArena(key) {
            document.getElementById('hindi-dashboard').style.display = "none";
            document.getElementById('practice-arena').style.display = "block";
            
            const ch = hindiDatabase[key];
            document.getElementById('arena-title').innerText = ch.title;
            document.getElementById('arena-subtitle').innerText = ch.sub;

            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            if(!ch.questions || ch.questions.length === 0) {
                container.innerHTML = "<div class='q-title' style='color: var(--text-sub);'>इस अध्याय के दीर्घ उत्तरीय प्रश्न (Long Answers) जल्द ही जोड़े जाएंगे। तब तक पाठ 1 और 11 का अभ्यास करें!</div>";
                return;
            }

            ch.questions.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = "question-box";
                box.innerHTML = `
                    <div class="q-title">${item.q}</div>
                    <button class="show-ans-btn" onclick="toggleAnswer(this)">Show Model Answer</button>
                    <div class="answer-content">${item.ans}</div>
                `;
                container.appendChild(box);
            });
        }

        function toggleAnswer(btn) {
            const ansContent = btn.nextElementSibling;
            if (ansContent.style.display === "block") {
                ansContent.style.display = "none";
                btn.innerText = "Show Model Answer";
            } else {
                ansContent.style.display = "block";
                btn.innerText = "Hide Answer";
            }
        }

        function closeArena() {
            document.getElementById('practice-arena').style.display = "none";
            document.getElementById('hindi-dashboard').style.display = "block";
        }

        initDashboard();
    </script>
