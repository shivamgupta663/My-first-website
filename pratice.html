<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Practice Arena - Set 1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-glow: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-btn:hover { color: var(--accent-blue); }

        h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-sub);
            margin-bottom: 30px;
            font-size: 0.95rem;
            text-align: center;
        }

        .tabs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.03);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .tab-btn.active[data-mode="normal"] { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); }
        .tab-btn.active[data-mode="high"] { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .tab-btn.active[data-mode="reasoning"] { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: #131c2e;
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover { border-color: var(--accent-blue); background-color: #1b2640; }
        .option-btn.correct { background-color: rgba(74, 222, 128, 0.15) !important; border-color: var(--accent-green) !important; color: var(--accent-green); }
        .option-btn.wrong { background-color: rgba(248, 113, 113, 0.15) !important; border-color: var(--accent-red) !important; color: var(--accent-red); }
    </style>
</head>

        const urlParams = new URLSearchParams(window.location.search);
        const activeChKey = urlParams.get('ch') || 'gst';

        function renderQuestions(mode) {
            const targetData = chaptersDatabase[activeChKey];
            if (!targetData) {
                document.getElementById('chapter-title').innerText = "Chapter Comming Soon!";
                document.getElementById('chapter-subtitle').innerText = "We are compiling Set 1 questions currently.";
                return;
            }
            
            document.getElementById('chapter-title').innerText = targetData.title;
            document.getElementById('chapter-subtitle').innerText = targetData.sub;

            const arena = document.getElementById('quiz-arena');
            arena.innerHTML = ''; 
            
            const list = targetData[mode] || [];
            if(list.length === 0) {
                arena.innerHTML = `<p style='text-align:center; color:var(--text-sub); margin-top:20px;'>Set 1 for this mode is being updated shortly!</p>`;
                return;
            }

            list.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';

                const qText = document.createElement('div');
                qText.className = 'q-text';
                qText.innerText = `Q${idx + 1}. ${item.q}`;
                card.appendChild(qText);

                const grid = document.createElement('div');
                grid.className = 'options-grid';

                item.ops.forEach((opt, oIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    
                    btn.onclick = () => {
                        const buttons = grid.querySelectorAll('.option-btn');
                        buttons.forEach(b => b.disabled = true);
                        
                        if(oIdx === item.ai) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('wrong');
                            buttons[item.ai].classList.add('correct');
                        }
                    };
                    grid.appendChild(btn);
                });

                card.appendChild(grid);
                arena.appendChild(card);
            });
        }

        function switchMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-mode="${mode}"]`).classList.add('active');
            renderQuestions(mode);
        }

        renderQuestions('normal');
    </script>
