<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ICSE Class 10 Premium Hub - Shivam Gupta</title>
    <meta name="description" content="Ultimate online study hub for ICSE Class 10 all subjects by Shivam Gupta. Practice Mathematics chapters and Hindi Sahitya Sagar (Gadhya & Padhya) with multi-level questions.">
    <meta name="keywords" content="ICSE Class 10, Shivam Gupta, ICSE Board Exam, Class 10 Maths, ICSE Hindi, Sahitya Sagar, Baat Athanni Ki, Premium Practice Arena, Study Hub">
    <meta name="author" content="Shivam Gupta">

    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #1c2541;
            --text-main: #f8fafc;
            --text-sub: #8da9c4;
            --accent-blue: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        /* Subject Selection Grid */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 2px solid rgba(56, 189, 248, 0.1);
            color: var(--text-main);
            padding: 40px 20px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .subject-card:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>ICSE Class 10 Premium Hub</h1>
            <p style="color: var(--text-sub); font-size: 1.1rem;">Created by Shivam Gupta • Select a subject to enter the Practice Arena</p>
        </div>

        <div class="subject-grid">
            <a href="maths.html" class="subject-card">
                <span class="icon">📐</span><br>Mathematics
            </a>
            <a href="hindi.html" class="subject-card">
                <span class="icon">✍️</span><br>Hindi (हिंदी)
            </a>
        </div>
    </div>

</body>
</html>
