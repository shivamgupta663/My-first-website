<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICSE & ISC Student Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container { max-width: 500px; margin: 40px auto; }
        h1 { color: #0f172a; margin-bottom: 5px; }
        .subtitle { color: #64748b; margin-bottom: 40px; }
        
        /* Class Button Styling */
        .class-card {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            text-decoration: none;
            display: block;
            font-size: 1.3rem;
            font-weight: bold;
            color: #0284c7;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }
        .class-card:hover {
            transform: translateY(-3px);
            border-color: #0284c7;
            background-color: #f0f9ff;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.1);
        }
        .class-desc {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: normal;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎓 Board Practice Portal</h1>
        <p class="subtitle">Apni Class select karke padhai shuru karein</p>

        <a href="class10.html" class="class-card">
            ICSE - Class 10
            <div class="class-desc">Mathematics, Commercial Studies & Applications</div>
        </a>

        <a href="class11.html" class="class-card">
            ISC - Class 11
            <div class="class-desc">Computer Science, Mathematics & Science</div>
        </a>
    </div>

</body>
</html>
